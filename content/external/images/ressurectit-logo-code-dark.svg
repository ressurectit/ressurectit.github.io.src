<svg width="400" height="118" viewBox="0 0 400 118" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ressurectit-logo-code-rain-title ressurectit-logo-code-rain-desc">
    <title id="ressurectit-logo-code-rain-title">ressurectIt logo code block</title>
    <desc id="ressurectit-logo-code-rain-desc">A compact dark badge for ressurectIt, with clipped distant JavaScript Fibonacci code beside the wordmark.</desc>

    <defs>
        <linearGradient id="codeRainBadgeGlow" x1="36" y1="18" x2="369" y2="107" gradientUnits="userSpaceOnUse">
            <stop stop-color="#132338"/>
            <stop offset=".52" stop-color="#0b1220"/>
            <stop offset="1" stop-color="#101820"/>
        </linearGradient>

        <linearGradient id="codeRainWordGradient" x1="115" y1="38" x2="339" y2="80" gradientUnits="userSpaceOnUse">
            <stop stop-color="#f8fafc"/>
            <stop offset=".7" stop-color="#e5edf7"/>
            <stop offset="1" stop-color="#93c5fd"/>
        </linearGradient>

        <linearGradient id="codeRainTileGlow" x1="8" y1="5" x2="62" y2="67" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0b2b1e"/>
            <stop offset=".55" stop-color="#06151d"/>
            <stop offset="1" stop-color="#0f172a"/>
        </linearGradient>

        <filter id="codeRainShadow" x="0" y="0" width="400" height="118" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity=".28"/>
        </filter>

        <clipPath id="codeRainTileClip">
            <rect width="70" height="70" rx="22"/>
        </clipPath>
    </defs>

    <g filter="url(#codeRainShadow)">
        <rect x="8" y="10" width="384" height="98" rx="30" fill="url(#codeRainBadgeGlow)"/>
        <rect x="8.75" y="10.75" width="382.5" height="96.5" rx="29.25" stroke="#26354b" stroke-width="1.5"/>
    </g>

    <g transform="translate(25 24)">
        <rect width="70" height="70" rx="22" fill="#07111a"/>
        <rect x=".75" y=".75" width="68.5" height="68.5" rx="21.25" stroke="#334155" stroke-width="1.5"/>

        <g clip-path="url(#codeRainTileClip)">
            <rect width="70" height="70" fill="url(#codeRainTileGlow)"/>

            <g transform="translate(-22 -8)" font-family="Consolas, 'Cascadia Mono', monospace" font-size="7" font-weight="600" opacity=".78">
                <text x="0" y="4" fill="#86efac">function fibonacci(n) {</text>
                <text x="0" y="17" fill="#e2e8f0">  if (n &lt;= 1) return n;</text>
                <text x="0" y="30" fill="#38bdf8">  let previous = 0;</text>
                <text x="0" y="43" fill="#38bdf8">  let current = 1;</text>
                <text x="0" y="56" fill="#e2e8f0">  for (let i = 2; i &lt;= n; i++) {</text>
                <text x="0" y="69" fill="#bbf7d0">    const next = previous + current;</text>
                <text x="0" y="82" fill="#e2e8f0">    previous = current;</text>
                <text x="0" y="95" fill="#e2e8f0">    current = next;</text>
                <text x="0" y="108" fill="#86efac">  }</text>
                <text x="0" y="121" fill="#86efac">  return current;</text>
            </g>
        </g>
    </g>

    <text x="112" y="62" fill="url(#codeRainWordGradient)" font-family="Bahnschrift, 'Aptos Display', 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="-.9">
        ressurect<tspan fill="#93c5fd">It</tspan>
    </text>

    <g transform="translate(114 75)">
        <text fill="#94a3b8" font-family="Bahnschrift, 'Aptos', 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="1.8">
            ANGULAR · TYPESCRIPT · .NET · CSS
        </text>
    </g>
</svg>
