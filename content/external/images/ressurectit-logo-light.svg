<svg width="320" height="98" viewBox="0 0 320 98" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ressurectit-logo-text-light-title ressurectit-logo-text-light-desc">
    <title id="ressurectit-logo-text-light-title">ressurectIt text logo light theme</title>
    <desc id="ressurectit-logo-text-light-desc">A compact light text-only badge for ressurectIt with a technology subtitle.</desc>

    <defs>
        <linearGradient id="textLightBadgeGlow" x1="30" y1="15" x2="296" y2="86" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffffff"/>
            <stop offset=".55" stop-color="#f5f9ff"/>
            <stop offset="1" stop-color="#eaf4ff"/>
        </linearGradient>

        <linearGradient id="textLightWordGradient" x1="36" y1="29" x2="240" y2="64" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0f172a"/>
            <stop offset=".72" stop-color="#1e293b"/>
            <stop offset="1" stop-color="#2563eb"/>
        </linearGradient>

        <filter id="textLightShadow" x="0" y="0" width="320" height="98" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity=".2"/>
        </filter>
    </defs>

    <g filter="url(#textLightShadow)">
        <rect x="8" y="10" width="304" height="78" rx="26" fill="url(#textLightBadgeGlow)"/>
        <rect x="8.75" y="10.75" width="302.5" height="76.5" rx="25.25" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>

    <text x="34" y="49" fill="url(#textLightWordGradient)" font-family="Bahnschrift, 'Aptos Display', 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="-.9">
        ressurect<tspan fill="#2563eb">It</tspan>
    </text>

    <text x="36" y="68" fill="#64748b" font-family="Bahnschrift, 'Aptos', 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="1.8">
        ANGULAR · TYPESCRIPT · .NET · CSS
    </text>
</svg>
