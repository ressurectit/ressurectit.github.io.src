<svg width="400" height="118" viewBox="0 0 400 118" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ressurectit-logo-code-rain-light-title ressurectit-logo-code-rain-light-desc">
    <title id="ressurectit-logo-code-rain-light-title">ressurectIt logo code block light theme</title>
    <desc id="ressurectit-logo-code-rain-light-desc">A compact light badge for ressurectIt, with clipped distant JavaScript Fibonacci code beside the wordmark.</desc>

    <defs>
        <linearGradient id="codeRainLightBadgeGlow" x1="36" y1="17" x2="367" y2="106" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffffff"/>
            <stop offset=".55" stop-color="#f5f9ff"/>
            <stop offset="1" stop-color="#eaf4ff"/>
        </linearGradient>

        <linearGradient id="codeRainLightWordGradient" x1="115" y1="38" x2="339" y2="80" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0f172a"/>
            <stop offset=".72" stop-color="#1e293b"/>
            <stop offset="1" stop-color="#2563eb"/>
        </linearGradient>

        <linearGradient id="codeRainLightTileGlow" x1="8" y1="5" x2="62" y2="67" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ecfdf5"/>
            <stop offset=".55" stop-color="#e0f2fe"/>
            <stop offset="1" stop-color="#f8fafc"/>
        </linearGradient>

        <filter id="codeRainLightShadow" x="0" y="0" width="400" height="118" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity=".2"/>
        </filter>

        <clipPath id="codeRainLightTileClip">
            <rect width="70" height="70" rx="22"/>
        </clipPath>
    </defs>

    <g filter="url(#codeRainLightShadow)">
        <rect x="8" y="10" width="384" height="98" rx="30" fill="url(#codeRainLightBadgeGlow)"/>
        <rect x="8.75" y="10.75" width="382.5" height="96.5" rx="29.25" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>

    <g transform="translate(25 24)">
        <rect width="70" height="70" rx="22" fill="#f8fafc"/>
        <rect x=".75" y=".75" width="68.5" height="68.5" rx="21.25" stroke="#cbd5e1" stroke-width="1.5"/>

        <g clip-path="url(#codeRainLightTileClip)">
            <rect width="70" height="70" fill="url(#codeRainLightTileGlow)"/>

            <g transform="translate(-22 -8)" font-family="Consolas, 'Cascadia Mono', monospace" font-size="7" font-weight="600" opacity=".74">
                <text x="0" y="4" fill="#15803d">function fibonacci(n) {</text>
                <text x="0" y="17" fill="#1e293b">  if (n &lt;= 1) return n;</text>
                <text x="0" y="30" fill="#0284c7">  let previous = 0;</text>
                <text x="0" y="43" fill="#0284c7">  let current = 1;</text>
                <text x="0" y="56" fill="#1e293b">  for (let i = 2; i &lt;= n; i++) {</text>
                <text x="0" y="69" fill="#16a34a">    const next = previous + current;</text>
                <text x="0" y="82" fill="#1e293b">    previous = current;</text>
                <text x="0" y="95" fill="#1e293b">    current = next;</text>
                <text x="0" y="108" fill="#15803d">  }</text>
                <text x="0" y="121" fill="#15803d">  return current;</text>
            </g>
        </g>
    </g>

    <text x="112" y="62" fill="url(#codeRainLightWordGradient)" font-family="Bahnschrift, 'Aptos Display', 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="-.9">
        ressurect<tspan fill="#2563eb">It</tspan>
    </text>

    <g transform="translate(114 75)">
        <text fill="#64748b" font-family="Bahnschrift, 'Aptos', 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="1.8">
            ANGULAR · TYPESCRIPT · .NET · CSS
        </text>
    </g>
</svg>
